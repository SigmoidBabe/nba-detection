[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "person-inference"
version = "0.1.0"
description = "Object detection and segmentation with PT, ONNX, or TensorRT backends"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
    "shapely",
]

[project.optional-dependencies]
ultralytics = ["ultralytics"]
onnx = ["onnxruntime"]
tensorrt = ["tensorrt==10.13.2.6", 
            "pycuda==2026.1",]

[tool.setuptools.packages.find]
where = ["src"]
include = ["person_inference*"]
